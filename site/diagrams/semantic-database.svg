<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Governed SQL: business meaning before data access</title><desc id="desc">The LLM plans a query. Shared definitions, access controls, and reconciliation constrain the result. Valid SQL can still answer the wrong business question. Govern definitions, table grain, joins, and source ownership.</desc><defs><marker id="request-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#345b92" stroke-width="1.6"/></marker><marker id="async-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#14786b" stroke-width="1.6"/></marker><marker id="control-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ab7628" stroke-width="1.6"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce6ee"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1600" height="1000" fill="#f8fbfe"/><rect width="1600" height="1000" fill="url(#grid)"/><text x="40" y="49" font-size="30" fill="#20334b" font-weight="700">Governed SQL: business meaning before data access</text><text x="40" y="83" font-size="19" fill="#61738a" font-weight="400">The LLM plans a query. Shared definitions, access controls, and reconciliation constrain the result.</text><rect x="40" y="135" width="330" height="760" rx="16" fill="#fff" stroke="#bdd0df" stroke-width="2" stroke-dasharray="7 7"/><text x="62" y="169" font-size="19" fill="#345b92" font-weight="700">BUSINESS EXPERIENCE</text><text x="62" y="195" font-size="16" fill="#20334b" font-weight="400">A question with a defined purpose</text><rect x="395" y="135" width="760" height="760" rx="16" fill="#fff" stroke="#bdd0df" stroke-width="2" stroke-dasharray="7 7"/><text x="417" y="169" font-size="19" fill="#345b92" font-weight="700">GOVERNED AGENT RUNTIME</text><text x="417" y="195" font-size="16" fill="#20334b" font-weight="400">Meaning, access, validation, and human review</text><rect x="1180" y="135" width="380" height="760" rx="16" fill="#fff" stroke="#bdd0df" stroke-width="2" stroke-dasharray="7 7"/><text x="1202" y="169" font-size="19" fill="#14786b" font-weight="700">PROTECTED DATA PRODUCTS</text><text x="1202" y="195" font-size="16" fill="#20334b" font-weight="400">Approved interfaces to enterprise data</text><g><rect x="65" y="235" width="280" height="110" rx="12" fill="#fff7e6" stroke="#ab7628" stroke-width="1.7"/><rect x="65" y="251" width="5" height="78" rx="2" fill="#ab7628"/><text x="84" y="269" font-size="22" fill="#20334b" font-weight="700">Business user</text><text x="84" y="299" font-size="18" fill="#61738a" font-weight="400">“What is net revenue</text><text x="84" y="324" font-size="18" fill="#61738a" font-weight="400">by region this quarter?”</text></g><g><rect x="65" y="445" width="280" height="130" rx="12" fill="#f1f6fc" stroke="#345b92" stroke-width="1.7"/><rect x="65" y="461" width="5" height="98" rx="2" fill="#345b92"/><text x="84" y="479" font-size="22" fill="#20334b" font-weight="700">Assistant application</text><text x="84" y="509" font-size="18" fill="#61738a" font-weight="400">Capture business intent</text><text x="84" y="534" font-size="18" fill="#61738a" font-weight="400">Carry user identity</text><text x="84" y="559" font-size="18" fill="#61738a" font-weight="400">Keep request audit trail</text></g><g><rect x="65" y="720" width="280" height="125" rx="12" fill="#f1f6fc" stroke="#345b92" stroke-width="1.7"/><rect x="65" y="736" width="5" height="93" rx="2" fill="#345b92"/><text x="84" y="754" font-size="22" fill="#20334b" font-weight="700">Cited business answer</text><text x="84" y="784" font-size="18" fill="#61738a" font-weight="400">Metric definition + period</text><text x="84" y="809" font-size="18" fill="#61738a" font-weight="400">Source + query reference</text><text x="84" y="834" font-size="18" fill="#61738a" font-weight="400">Caveats and review status</text></g><g><rect x="425" y="230" width="315" height="125" rx="12" fill="#eef6fa" stroke="#345b92" stroke-width="1.7"/><rect x="425" y="246" width="5" height="93" rx="2" fill="#345b92"/><text x="444" y="264" font-size="22" fill="#20334b" font-weight="700">Identity + policy</text><text x="444" y="294" font-size="18" fill="#61738a" font-weight="400">User, purpose, permissions</text><text x="444" y="319" font-size="18" fill="#61738a" font-weight="400">Allowed metrics and tables</text><text x="444" y="344" font-size="18" fill="#61738a" font-weight="400">Enforce tenant boundaries</text></g><g><rect x="425" y="445" width="315" height="155" rx="12" fill="#f4effa" stroke="#735b99" stroke-width="1.7"/><rect x="425" y="461" width="5" height="123" rx="2" fill="#735b99"/><text x="444" y="479" font-size="22" fill="#20334b" font-weight="700">LLM query planner</text><text x="444" y="509" font-size="18" fill="#61738a" font-weight="400">Use supplied business context</text><text x="444" y="534" font-size="18" fill="#61738a" font-weight="400">Select approved metrics</text><text x="444" y="559" font-size="18" fill="#61738a" font-weight="400">Produce a structured SQL plan</text><text x="444" y="584" font-size="18" fill="#61738a" font-weight="400">Ask when intent is unclear</text></g><g><rect x="805" y="230" width="315" height="150" rx="12" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><rect x="805" y="246" width="5" height="118" rx="2" fill="#14786b"/><text x="824" y="264" font-size="22" fill="#20334b" font-weight="700">Semantic catalog</text><text x="824" y="294" font-size="18" fill="#61738a" font-weight="400">Owner-approved definitions</text><text x="824" y="319" font-size="18" fill="#61738a" font-weight="400">Metrics • table grain • joins</text><text x="824" y="344" font-size="18" fill="#61738a" font-weight="400">Units • dates • exclusions</text><text x="824" y="369" font-size="18" fill="#61738a" font-weight="400">Versioned business meaning</text></g><g><rect x="805" y="445" width="315" height="155" rx="12" fill="#eef6fa" stroke="#345b92" stroke-width="1.7"/><rect x="805" y="461" width="5" height="123" rx="2" fill="#345b92"/><text x="824" y="479" font-size="22" fill="#20334b" font-weight="700">SQL validator</text><text x="824" y="509" font-size="18" fill="#61738a" font-weight="400">Parse and check schema</text><text x="824" y="534" font-size="18" fill="#61738a" font-weight="400">Allowlist joins and columns</text><text x="824" y="559" font-size="18" fill="#61738a" font-weight="400">Reject writes; cap query cost</text><text x="824" y="584" font-size="18" fill="#61738a" font-weight="400">Apply access policy</text></g><g><rect x="805" y="715" width="315" height="130" rx="12" fill="#eef6fa" stroke="#345b92" stroke-width="1.7"/><rect x="805" y="731" width="5" height="98" rx="2" fill="#345b92"/><text x="824" y="749" font-size="22" fill="#20334b" font-weight="700">Result reconciliation</text><text x="824" y="779" font-size="18" fill="#61738a" font-weight="400">Check totals, units, freshness</text><text x="824" y="804" font-size="18" fill="#61738a" font-weight="400">Compare business invariants</text><text x="824" y="829" font-size="18" fill="#61738a" font-weight="400">Flag uncertainty or mismatch</text></g><g><rect x="425" y="715" width="315" height="130" rx="12" fill="#fff7e6" stroke="#ab7628" stroke-width="1.7"/><rect x="425" y="731" width="5" height="98" rx="2" fill="#ab7628"/><text x="444" y="749" font-size="22" fill="#20334b" font-weight="700">Business reviewer</text><text x="444" y="779" font-size="18" fill="#61738a" font-weight="400">Clarify ambiguous meaning</text><text x="444" y="804" font-size="18" fill="#61738a" font-weight="400">Resolve failed checks</text><text x="444" y="829" font-size="18" fill="#61738a" font-weight="400">Record decision and owner</text></g><g><path d="M1230,453 C1230,429 1530,429 1530,453 L1530,607 C1530,631 1230,631 1230,607 Z" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><ellipse cx="1380" cy="453" rx="150" ry="18" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><text x="1248" y="494" font-size="22" fill="#20334b" font-weight="700">Read-only DB views</text><text x="1248" y="524" font-size="18" fill="#61738a" font-weight="400">Approved product interfaces</text><text x="1248" y="549" font-size="18" fill="#61738a" font-weight="400">Row / column access rules</text><text x="1248" y="574" font-size="18" fill="#61738a" font-weight="400">Quality + freshness contracts</text><text x="1248" y="599" font-size="18" fill="#61738a" font-weight="400">Named domain owners</text></g><path d="M205 345 V445" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="219" y="402" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">1  Question</text><path d="M345 480 H380 V295 H425" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="387" y="407" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">2  Identity + intent</text><path d="M582 355 V445" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="597" y="395" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">3  Allowed scope</text><path d="M960 380 V410 H695 V445" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="792" y="399" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">4  Metric context</text><path d="M740 520 H805" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="747" y="505" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">5  SQL</text><path d="M1120 520 H1230" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="1129" y="505" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">6  Query</text><path d="M1380 625 V670 H962 V715" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="1140" y="657" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">7  Typed rows + lineage</text><path d="M805 770 H740" fill="none" stroke="#ab7628" stroke-width="2.5"  marker-end="url(#control-arrow)"/><text x="750" y="755" font-size="17" fill="#ab7628" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">Hold</text><path d="M582 715 V600" fill="none" stroke="#ab7628" stroke-width="2.5"  marker-end="url(#control-arrow)"/><text x="597" y="658" font-size="17" fill="#ab7628" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">Clarify / approve</text><path d="M960 845 V880 H205 V845" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="430" y="867" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">8  Passed checks: answer + evidence</text><text x="1230" y="715" font-size="16" fill="#14786b" font-weight="700">SEMANTIC CONTRACT · EXAMPLE</text><text x="1230" y="748" font-size="22" fill="#20334b" font-weight="700">Net revenue</text><text x="1230" y="780" font-size="18" fill="#61738a" font-weight="400">Paid sales − refunds</text><text x="1230" y="808" font-size="18" fill="#61738a" font-weight="400">Grain: one order</text><text x="1230" y="836" font-size="18" fill="#61738a" font-weight="400">Time: completion date</text><text x="1230" y="864" font-size="18" fill="#61738a" font-weight="400">Owner: Finance · versioned</text><path d="M40 917 H1560" stroke="#cbd8e2"/><text x="40" y="947" font-size="18" fill="#61738a" font-weight="400">Valid SQL can still answer the wrong business question. Govern definitions, table grain, joins, and source ownership.</text><text x="40" y="978" font-size="17" fill="#61738a" font-weight="400">→ Request / response flow  |  ⇢ Dashed: preparation or persistence  |  Amber: approval / escalation</text></svg>