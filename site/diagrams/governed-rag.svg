<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">01  Governed document retrieval (RAG)</title><desc id="desc">Business question → permission-aware evidence → grounded draft → validation or human escalation Source owner approves knowledge. Backend enforces access. Citations and validation support review; they do not guarantee truth.</desc><defs><marker id="request-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#345b92" stroke-width="1.6"/></marker><marker id="async-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#14786b" stroke-width="1.6"/></marker><marker id="control-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ab7628" stroke-width="1.6"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce6ee"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1600" height="1000" fill="#f8fbfe"/><rect width="1600" height="1000" fill="url(#grid)"/><text x="40" y="49" font-size="30" fill="#20334b" font-weight="700">01  Governed document retrieval (RAG)</text><text x="40" y="83" font-size="19" fill="#61738a" font-weight="400">Business question → permission-aware evidence → grounded draft → validation or human escalation</text><rect x="40" y="120" width="320" height="760" rx="16" fill="#fff" stroke="#bdd0df" stroke-width="2" stroke-dasharray="7 7"/><text x="62" y="154" font-size="19" fill="#345b92" font-weight="700">KNOWLEDGE PLANE</text><text x="62" y="180" font-size="16" fill="#20334b" font-weight="400">Source owner · controlled refresh</text><rect x="400" y="120" width="790" height="760" rx="16" fill="#fff" stroke="#bdd0df" stroke-width="2" stroke-dasharray="7 7"/><text x="422" y="154" font-size="19" fill="#345b92" font-weight="700">APPLICATION TRUST BOUNDARY</text><text x="422" y="180" font-size="16" fill="#20334b" font-weight="400">Backend enforces identity, retrieval scope, and response checks</text><rect x="1230" y="120" width="330" height="470" rx="16" fill="#fff" stroke="#bdd0df" stroke-width="2" stroke-dasharray="7 7"/><text x="1252" y="154" font-size="19" fill="#345b92" font-weight="700">MODEL SERVICE BOUNDARY</text><text x="1252" y="180" font-size="16" fill="#20334b" font-weight="400">Send only approved, necessary context</text><g><path d="M70,208 C70,184 330,184 330,208 L330,312 C330,336 70,336 70,312 Z" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><ellipse cx="200" cy="208" rx="130" ry="18" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><text x="88" y="249" font-size="22" fill="#20334b" font-weight="700">Approved documents</text><text x="88" y="279" font-size="18" fill="#61738a" font-weight="400">Policies · procedures</text><text x="88" y="304" font-size="18" fill="#61738a" font-weight="400">Owner · version · date</text></g><g><rect x="70" y="410" width="260" height="130" rx="12" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><rect x="70" y="426" width="5" height="98" rx="2" fill="#14786b"/><text x="89" y="444" font-size="22" fill="#20334b" font-weight="700">Ingestion pipeline</text><text x="89" y="474" font-size="18" fill="#61738a" font-weight="400">Parse + chunk + source IDs</text><text x="89" y="499" font-size="18" fill="#61738a" font-weight="400">Quality + permissions</text></g><g><path d="M70,698 C70,674 330,674 330,698 L330,802 C330,826 70,826 70,802 Z" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><ellipse cx="200" cy="698" rx="130" ry="18" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><text x="88" y="739" font-size="22" fill="#20334b" font-weight="700">Search index</text><text x="88" y="769" font-size="18" fill="#61738a" font-weight="400">Keyword + vector retrieval</text><text x="88" y="794" font-size="18" fill="#61738a" font-weight="400">Passage text + ACL metadata</text></g><g><rect x="440" y="180" width="250" height="110" rx="12" fill="#f1f6fc" stroke="#345b92" stroke-width="1.7"/><rect x="440" y="196" width="5" height="78" rx="2" fill="#345b92"/><text x="459" y="214" font-size="22" fill="#20334b" font-weight="700">Business application</text><text x="459" y="244" font-size="18" fill="#61738a" font-weight="400">Question + user identity</text><text x="459" y="269" font-size="18" fill="#61738a" font-weight="400">Receives checked answer</text></g><g><rect x="810" y="180" width="330" height="110" rx="12" fill="#eef6fa" stroke="#345b92" stroke-width="1.7"/><rect x="810" y="196" width="5" height="78" rx="2" fill="#345b92"/><text x="829" y="214" font-size="22" fill="#20334b" font-weight="700">Identity &amp; access policy</text><text x="829" y="244" font-size="18" fill="#61738a" font-weight="400">Authenticate + user scope</text><text x="829" y="269" font-size="18" fill="#61738a" font-weight="400">Reject unauthorized requests</text></g><g><rect x="440" y="390" width="310" height="130" rx="12" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><rect x="440" y="406" width="5" height="98" rx="2" fill="#14786b"/><text x="459" y="424" font-size="22" fill="#20334b" font-weight="700">Retrieval service</text><text x="459" y="454" font-size="18" fill="#61738a" font-weight="400">Permissions + freshness</text><text x="459" y="479" font-size="18" fill="#61738a" font-weight="400">Search + rerank passages</text></g><g><rect x="830" y="390" width="310" height="130" rx="12" fill="#f1f6fc" stroke="#345b92" stroke-width="1.7"/><rect x="830" y="406" width="5" height="98" rx="2" fill="#345b92"/><text x="849" y="424" font-size="22" fill="#20334b" font-weight="700">Context assembler</text><text x="849" y="454" font-size="18" fill="#61738a" font-weight="400">Question + cited passages</text><text x="849" y="479" font-size="18" fill="#61738a" font-weight="400">Bounded context; separate rules</text></g><g><rect x="1270" y="390" width="250" height="130" rx="12" fill="#f4effa" stroke="#735b99" stroke-width="1.7"/><rect x="1270" y="406" width="5" height="98" rx="2" fill="#735b99"/><text x="1289" y="424" font-size="22" fill="#20334b" font-weight="700">LLM inference</text><text x="1289" y="454" font-size="18" fill="#61738a" font-weight="400">Generate a draft</text><text x="1289" y="479" font-size="18" fill="#61738a" font-weight="400">Draft + source IDs</text></g><g><rect x="440" y="660" width="310" height="130" rx="12" fill="#eef6fa" stroke="#345b92" stroke-width="1.7"/><rect x="440" y="676" width="5" height="98" rx="2" fill="#345b92"/><text x="459" y="694" font-size="22" fill="#20334b" font-weight="700">Response validator</text><text x="459" y="724" font-size="18" fill="#61738a" font-weight="400">Citations + material claims</text><text x="459" y="749" font-size="18" fill="#61738a" font-weight="400">Flag gaps or conflicts</text></g><g><rect x="830" y="660" width="310" height="130" rx="12" fill="#f1f6fc" stroke="#345b92" stroke-width="1.7"/><rect x="830" y="676" width="5" height="98" rx="2" fill="#345b92"/><text x="849" y="694" font-size="22" fill="#20334b" font-weight="700">Cited response</text><text x="849" y="724" font-size="18" fill="#61738a" font-weight="400">Answer + source provenance</text><text x="849" y="749" font-size="18" fill="#61738a" font-weight="400">Limits + unresolved gaps</text></g><g><rect x="1270" y="690" width="250" height="100" rx="12" fill="#fff7e6" stroke="#ab7628" stroke-width="1.7"/><rect x="1270" y="706" width="5" height="68" rx="2" fill="#ab7628"/><text x="1289" y="724" font-size="22" fill="#20334b" font-weight="700">Knowledge owner</text><text x="1289" y="754" font-size="18" fill="#61738a" font-weight="400">Review evidence gaps</text></g><path d="M200 330 V404" fill="none" stroke="#14786b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#async-arrow)"/><text x="215" y="381" font-size="17" fill="#14786b" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">prepare</text><path d="M200 540 V670" fill="none" stroke="#14786b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#async-arrow)"/><text x="215" y="595" font-size="17" fill="#14786b" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">refresh index</text><path d="M690 235 H802" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="717" y="220" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">request</text><path d="M975 290 V337 H595 V382" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="725" y="327" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">authorized scope</text><path d="M330 750 H380 V455 H432" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="343" y="607" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">passages</text><path d="M750 455 H822" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="756" y="440" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">context</text><path d="M1140 455 H1262" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="1155" y="438" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">model request</text><path d="M1395 520 V590 H595 V652" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="960" y="579" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">draft + source IDs</text><path d="M750 722 H822" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="759" y="707" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">checked</text><path d="M750 765 H780 V845 H1395 V798" fill="none" stroke="#ab7628" stroke-width="2.5"  marker-end="url(#control-arrow)"/><text x="837" y="834" font-size="17" fill="#ab7628" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">insufficient evidence → human escalation</text><path d="M40 917 H1560" stroke="#cbd8e2"/><text x="40" y="947" font-size="18" fill="#61738a" font-weight="400">Source owner approves knowledge. Backend enforces access. Citations and validation support review; they do not guarantee truth.</text><text x="40" y="978" font-size="17" fill="#61738a" font-weight="400">→ Request / response flow  |  ⇢ Dashed: preparation or persistence  |  Amber: approval / escalation</text></svg>