<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Retrieval and memory architecture</title><desc id="desc">Give the model the right evidence, preserve useful experience, and govern what survives beyond a task. Design rule: authoritative sources win conflicts. Keep transient task state separate from reviewed, revocable long-term memory.</desc><defs><marker id="request-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#345b92" stroke-width="1.6"/></marker><marker id="async-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#14786b" stroke-width="1.6"/></marker><marker id="control-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ab7628" stroke-width="1.6"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce6ee"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1600" height="1000" fill="#f8fbfe"/><rect width="1600" height="1000" fill="url(#grid)"/><text x="40" y="49" font-size="30" fill="#20334b" font-weight="700">Retrieval and memory architecture</text><text x="40" y="83" font-size="19" fill="#61738a" font-weight="400">Give the model the right evidence, preserve useful experience, and govern what survives beyond a task.</text><rect x="40" y="120" width="1520" height="250" rx="16" fill="#fff" stroke="#bdd0df" stroke-width="2" stroke-dasharray="7 7"/><text x="62" y="154" font-size="19" fill="#14786b" font-weight="700">Governed knowledge and memory</text><text x="62" y="180" font-size="16" fill="#20334b" font-weight="400">Scope every memory read. Memory is input data; it does not change the model’s weights.</text><rect x="40" y="395" width="1095" height="490" rx="16" fill="#fff" stroke="#bdd0df" stroke-width="2" stroke-dasharray="7 7"/><text x="62" y="429" font-size="19" fill="#345b92" font-weight="700">Trusted application runtime</text><text x="62" y="455" font-size="16" fill="#20334b" font-weight="400">Enforce access, assemble relevant context, and check the answer.</text><rect x="1205" y="395" width="355" height="265" rx="16" fill="#fff" stroke="#bdd0df" stroke-width="2" stroke-dasharray="7 7"/><text x="1227" y="429" font-size="19" fill="#735b99" font-weight="700">External model provider</text><text x="1227" y="455" font-size="16" fill="#20334b" font-weight="400">Contract + retention policy</text><rect x="1205" y="685" width="355" height="200" rx="16" fill="#fff" stroke="#bdd0df" stroke-width="2" stroke-dasharray="7 7"/><text x="1227" y="719" font-size="19" fill="#ab7628" font-weight="700">Memory governance</text><text x="1227" y="745" font-size="16" fill="#20334b" font-weight="400">Control every durable write</text><path d="M212 620 V715" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="225" y="676" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">Identity + task</text><path d="M355 785 H410 V580 H450" fill="none" stroke="#ab7628" stroke-width="2.5"  marker-end="url(#control-arrow)"/><text x="422" y="664" font-size="17" fill="#ab7628" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">Allowed scope</text><path d="M592 345 V490" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="604" y="474" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">Approved sources</text><path d="M948 345 V490" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="827" y="474" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">Task state</text><path d="M1378 345 V385 H1120 V475 H1040 V490" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="1160" y="379" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">Reviewed memory</text><path d="M735 555 H805" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="749" y="541" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">Facts</text><path d="M1090 530 H1235" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="1097" y="515" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">Bounded context</text><path d="M1235 595 H1165 V755 H1090" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="1140" y="678" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">Candidate answer</text><path d="M948 845 V865 H55 V555 H70" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="445" y="858" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">Checked answer · or human escalation</text><path d="M1090 810 H1235" fill="none" stroke="#ab7628" stroke-width="2.5"  marker-end="url(#control-arrow)"/><text x="1098" y="796" font-size="17" fill="#ab7628" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">Memory proposal</text><path d="M1520 810 H1545 V385 H1455 V345" fill="none" stroke="#14786b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#async-arrow)"/><g transform="translate(1556 731) rotate(-90)"><text x="0" y="0" font-size="17" fill="#14786b" font-weight="400">Approved write</text></g><g><path d="M450,238 C450,214 735,214 735,238 L735,327 C735,351 450,351 450,327 Z" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><ellipse cx="592.5" cy="238" rx="142.5" ry="18" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><text x="468" y="279" font-size="22" fill="#20334b" font-weight="700">Knowledge index</text><text x="468" y="309" font-size="18" fill="#61738a" font-weight="400">Owned business knowledge</text><text x="468" y="334" font-size="18" fill="#61738a" font-weight="400">ACLs, lineage, freshness</text></g><g><path d="M805,238 C805,214 1090,214 1090,238 L1090,327 C1090,351 805,351 805,327 Z" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><ellipse cx="947.5" cy="238" rx="142.5" ry="18" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><text x="823" y="279" font-size="22" fill="#20334b" font-weight="700">Short-term task state</text><text x="823" y="309" font-size="18" fill="#61738a" font-weight="400">Progress + tool results</text><text x="823" y="334" font-size="18" fill="#61738a" font-weight="400">Expires with the session</text></g><g><path d="M1235,238 C1235,214 1520,214 1520,238 L1520,327 C1520,351 1235,351 1235,327 Z" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><ellipse cx="1377.5" cy="238" rx="142.5" ry="18" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><text x="1253" y="279" font-size="22" fill="#20334b" font-weight="700">Long-term memory</text><text x="1253" y="309" font-size="18" fill="#61738a" font-weight="400">Approved reusable facts</text><text x="1253" y="334" font-size="18" fill="#61738a" font-weight="400">Tenant / user scoped</text></g><g><rect x="70" y="490" width="285" height="130" rx="12" fill="#f1f6fc" stroke="#345b92" stroke-width="1.7"/><rect x="70" y="506" width="5" height="98" rx="2" fill="#345b92"/><text x="89" y="524" font-size="22" fill="#20334b" font-weight="700">Business application</text><text x="89" y="554" font-size="18" fill="#61738a" font-weight="400">User question + goal</text><text x="89" y="579" font-size="18" fill="#61738a" font-weight="400">Owns the current task</text></g><g><rect x="70" y="715" width="285" height="130" rx="12" fill="#eef6fa" stroke="#345b92" stroke-width="1.7"/><rect x="70" y="731" width="5" height="98" rx="2" fill="#345b92"/><text x="89" y="749" font-size="22" fill="#20334b" font-weight="700">Identity &amp; policy</text><text x="89" y="779" font-size="18" fill="#61738a" font-weight="400">Row / document access</text><text x="89" y="804" font-size="18" fill="#61738a" font-weight="400">Purpose + memory scope</text></g><g><rect x="450" y="490" width="285" height="130" rx="12" fill="#f1f6fc" stroke="#345b92" stroke-width="1.7"/><rect x="450" y="506" width="5" height="98" rx="2" fill="#345b92"/><text x="469" y="524" font-size="22" fill="#20334b" font-weight="700">Scoped retrieval</text><text x="469" y="554" font-size="18" fill="#61738a" font-weight="400">Filter by permissions</text><text x="469" y="579" font-size="18" fill="#61738a" font-weight="400">Find relevant evidence</text></g><g><rect x="805" y="490" width="285" height="130" rx="12" fill="#f1f6fc" stroke="#345b92" stroke-width="1.7"/><rect x="805" y="506" width="5" height="98" rx="2" fill="#345b92"/><text x="824" y="524" font-size="22" fill="#20334b" font-weight="700">Context assembler</text><text x="824" y="554" font-size="18" fill="#61738a" font-weight="400">Rank + fit token budget</text><text x="824" y="579" font-size="18" fill="#61738a" font-weight="400">Facts before memory</text></g><g><rect x="1235" y="490" width="285" height="130" rx="12" fill="#f4effa" stroke="#735b99" stroke-width="1.7"/><rect x="1235" y="506" width="5" height="98" rx="2" fill="#735b99"/><text x="1254" y="524" font-size="22" fill="#20334b" font-weight="700">LLM inference</text><text x="1254" y="554" font-size="18" fill="#61738a" font-weight="400">Task + selected context</text><text x="1254" y="579" font-size="18" fill="#61738a" font-weight="400">Generates a candidate</text></g><g><rect x="805" y="715" width="285" height="130" rx="12" fill="#eef6fa" stroke="#345b92" stroke-width="1.7"/><rect x="805" y="731" width="5" height="98" rx="2" fill="#345b92"/><text x="824" y="749" font-size="22" fill="#20334b" font-weight="700">Answer validation</text><text x="824" y="779" font-size="18" fill="#61738a" font-weight="400">Citations + task checks</text><text x="824" y="804" font-size="18" fill="#61738a" font-weight="400">Abstain / route to human</text></g><g><rect x="1235" y="760" width="285" height="100" rx="12" fill="#fff7e6" stroke="#ab7628" stroke-width="1.7"/><rect x="1235" y="776" width="5" height="68" rx="2" fill="#ab7628"/><text x="1254" y="794" font-size="22" fill="#20334b" font-weight="700">Memory write review</text><text x="1254" y="824" font-size="18" fill="#61738a" font-weight="400">Approval + consent</text><text x="1254" y="849" font-size="18" fill="#61738a" font-weight="400">Provenance + expiry</text></g><path d="M40 917 H1560" stroke="#cbd8e2"/><text x="40" y="947" font-size="18" fill="#61738a" font-weight="400">Design rule: authoritative sources win conflicts. Keep transient task state separate from reviewed, revocable long-term memory.</text><text x="40" y="978" font-size="17" fill="#61738a" font-weight="400">→ Request / response flow  |  ⇢ Dashed: preparation or persistence  |  Amber: approval / escalation</text></svg>