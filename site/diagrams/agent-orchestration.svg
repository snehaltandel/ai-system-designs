<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Extensible agents with controlled business actions</title><desc id="desc">One orchestrator coordinates specialists and reusable skills; evidence, policy and people govern execution. LLM specialists suggest actions. Governed tools and explicit decision controls determine what can execute.</desc><defs><marker id="request-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#345b92" stroke-width="1.6"/></marker><marker id="async-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#14786b" stroke-width="1.6"/></marker><marker id="control-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ab7628" stroke-width="1.6"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce6ee"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1600" height="1000" fill="#f8fbfe"/><rect width="1600" height="1000" fill="url(#grid)"/><text x="40" y="49" font-size="30" fill="#20334b" font-weight="700">Extensible agents with controlled business actions</text><text x="40" y="83" font-size="19" fill="#61738a" font-weight="400">One orchestrator coordinates specialists and reusable skills; evidence, policy and people govern execution.</text><rect x="40" y="120" width="1520" height="235" rx="16" fill="#fff" stroke="#bdd0df" stroke-width="2" stroke-dasharray="7 7"/><text x="62" y="154" font-size="19" fill="#345b92" font-weight="700">01 · Coordination</text><rect x="40" y="375" width="1520" height="245" rx="16" fill="#fff" stroke="#bdd0df" stroke-width="2" stroke-dasharray="7 7"/><text x="62" y="409" font-size="19" fill="#735b99" font-weight="700">02 · Specialist runtime</text><rect x="40" y="640" width="1520" height="250" rx="16" fill="#fff" stroke="#bdd0df" stroke-width="2" stroke-dasharray="7 7"/><text x="62" y="674" font-size="19" fill="#ab7628" font-weight="700">03 · Decision controls</text><g><rect x="65" y="205" width="335" height="130" rx="12" fill="#eef6fa" stroke="#345b92" stroke-width="1.7"/><rect x="65" y="221" width="5" height="98" rx="2" fill="#345b92"/><text x="84" y="239" font-size="22" fill="#20334b" font-weight="700">Application / identity</text><text x="84" y="269" font-size="18" fill="#61738a" font-weight="400">User, purpose + tenant</text><text x="84" y="294" font-size="18" fill="#61738a" font-weight="400">Policy, risk tier + role</text></g><g><rect x="600" y="200" width="400" height="140" rx="12" fill="#eef6fa" stroke="#345b92" stroke-width="1.7"/><rect x="600" y="216" width="5" height="108" rx="2" fill="#345b92"/><text x="619" y="234" font-size="22" fill="#20334b" font-weight="700">Orchestrator</text><text x="619" y="264" font-size="18" fill="#61738a" font-weight="400">Owns state + task plan</text><text x="619" y="289" font-size="18" fill="#61738a" font-weight="400">Budgets, permissions + timeouts</text><text x="619" y="314" font-size="18" fill="#61738a" font-weight="400">Dispatch, collect + stop</text></g><g><rect x="1200" y="205" width="330" height="130" rx="12" fill="#f1f6fc" stroke="#345b92" stroke-width="1.7"/><rect x="1200" y="221" width="5" height="98" rx="2" fill="#345b92"/><text x="1219" y="239" font-size="22" fill="#20334b" font-weight="700">Versioned skill registry</text><text x="1219" y="269" font-size="18" fill="#61738a" font-weight="400">Typed contracts + test suites</text><text x="1219" y="294" font-size="18" fill="#61738a" font-weight="400">Tools, prompts + procedures</text><text x="1219" y="319" font-size="18" fill="#61738a" font-weight="400">Reusable capability versions</text></g><g><rect x="65" y="460" width="380" height="130" rx="12" fill="#f4effa" stroke="#735b99" stroke-width="1.7"/><rect x="65" y="476" width="5" height="98" rx="2" fill="#735b99"/><text x="84" y="494" font-size="22" fill="#20334b" font-weight="700">Specialist agents</text><text x="84" y="524" font-size="18" fill="#61738a" font-weight="400">Data agent · business semantics</text><text x="84" y="549" font-size="18" fill="#61738a" font-weight="400">Knowledge agent · trusted context</text><text x="84" y="574" font-size="18" fill="#61738a" font-weight="400">Return evidence with proposals</text></g><g><rect x="560" y="460" width="360" height="130" rx="12" fill="#eef6fa" stroke="#345b92" stroke-width="1.7"/><rect x="560" y="476" width="5" height="98" rx="2" fill="#345b92"/><text x="579" y="494" font-size="22" fill="#20334b" font-weight="700">Tool gateway</text><text x="579" y="524" font-size="18" fill="#61738a" font-weight="400">Allowlist + schema validation</text><text x="579" y="549" font-size="18" fill="#61738a" font-weight="400">Least privilege + rate limits</text><text x="579" y="574" font-size="18" fill="#61738a" font-weight="400">Credentials stay in gateway</text></g><g><path d="M1130,478 C1130,454 1530,454 1530,478 L1530,592 C1530,616 1130,616 1130,592 Z" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><ellipse cx="1330" cy="478" rx="200" ry="18" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><text x="1148" y="519" font-size="22" fill="#20334b" font-weight="700">Read-only source systems</text><text x="1148" y="549" font-size="18" fill="#61738a" font-weight="400">Warehouse · documents · CRM</text><text x="1148" y="574" font-size="18" fill="#61738a" font-weight="400">Tenant-scoped, governed views</text></g><g><rect x="65" y="725" width="300" height="145" rx="12" fill="#eef6fa" stroke="#345b92" stroke-width="1.7"/><rect x="65" y="741" width="5" height="113" rx="2" fill="#345b92"/><text x="84" y="759" font-size="22" fill="#20334b" font-weight="700">Proposal validation</text><text x="84" y="789" font-size="18" fill="#61738a" font-weight="400">Evidence + output schema</text><text x="84" y="814" font-size="18" fill="#61738a" font-weight="400">Policy + deterministic checks</text><text x="84" y="839" font-size="18" fill="#61738a" font-weight="400">Uncertainty → escalation</text></g><g><rect x="455" y="725" width="300" height="145" rx="12" fill="#fff7e6" stroke="#ab7628" stroke-width="1.7"/><rect x="455" y="741" width="5" height="113" rx="2" fill="#ab7628"/><text x="474" y="759" font-size="22" fill="#20334b" font-weight="700">Human approval</text><text x="474" y="789" font-size="18" fill="#61738a" font-weight="400">Exact action + parameters</text><text x="474" y="814" font-size="18" fill="#61738a" font-weight="400">Identity, expiry + signature</text><text x="474" y="839" font-size="18" fill="#61738a" font-weight="400">Approve / reject / escalate</text></g><g><rect x="845" y="725" width="340" height="145" rx="12" fill="#eef6fa" stroke="#345b92" stroke-width="1.7"/><rect x="845" y="741" width="5" height="113" rx="2" fill="#345b92"/><text x="864" y="759" font-size="22" fill="#20334b" font-weight="700">Execution service</text><text x="864" y="789" font-size="18" fill="#61738a" font-weight="400">Recheck policy + approval hash</text><text x="864" y="814" font-size="18" fill="#61738a" font-weight="400">Idempotency + bounded retries</text><text x="864" y="839" font-size="18" fill="#61738a" font-weight="400">Reject stale or altered requests</text></g><g><rect x="1260" y="725" width="270" height="145" rx="12" fill="#edf8f3" stroke="#14786b" stroke-width="1.7"/><rect x="1260" y="741" width="5" height="113" rx="2" fill="#14786b"/><text x="1279" y="759" font-size="22" fill="#20334b" font-weight="700">Business systems</text><text x="1279" y="789" font-size="18" fill="#61738a" font-weight="400">Approved transactions</text><text x="1279" y="814" font-size="18" fill="#61738a" font-weight="400">Receipts + audit log</text></g><path d="M400 266 H600" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="437" y="252" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">task + identity</text><path d="M1000 253 H1200" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="1037" y="240" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">resolve version</text><path d="M1200 298 H1000" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="1044" y="285" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">skill contract</text><path d="M660 340 V368 H470 V486 H445" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="485" y="360" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">delegate task</text><path d="M445 505 H520 V385 H800 V340" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="623" y="380" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">status + evidence</text><path d="M445 524 H560" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="465" y="511" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">typed call</text><path d="M560 568 H445" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="466" y="555" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">evidence</text><path d="M920 524 H1130" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="972" y="511" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">scoped read</text><path d="M1130 568 H920" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="966" y="555" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">rows / passages</text><path d="M600 302 H555 V345 H50 V697 H215 V725" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="80" y="690" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">proposed action</text><path d="M365 798 H455" fill="none" stroke="#ab7628" stroke-width="2.5"  marker-end="url(#control-arrow)"/><text x="382" y="784" font-size="17" fill="#ab7628" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">review</text><path d="M755 798 H845" fill="none" stroke="#ab7628" stroke-width="2.5"  marker-end="url(#control-arrow)"/><text x="767" y="784" font-size="17" fill="#ab7628" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">approve</text><path d="M1185 798 H1260" fill="none" stroke="#345b92" stroke-width="2.5"  marker-end="url(#request-arrow)"/><text x="1194" y="784" font-size="17" fill="#345b92" paint-order="stroke" stroke="#f8fbfe" stroke-width="6" stroke-linejoin="round">commit</text><text x="615" y="684" font-size="17" fill="#61738a" font-weight="400">Every action is bound to its approved parameters; changes require a new decision.</text><path d="M40 917 H1560" stroke="#cbd8e2"/><text x="40" y="947" font-size="18" fill="#61738a" font-weight="400">LLM specialists suggest actions. Governed tools and explicit decision controls determine what can execute.</text><text x="40" y="978" font-size="17" fill="#61738a" font-weight="400">→ Request / response flow  |  ⇢ Dashed: preparation or persistence  |  Amber: approval / escalation</text></svg>